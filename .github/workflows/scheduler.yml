name: Scheduled Job

on:
  schedule:
   - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  run-scheduled-task:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get OAuth Token
      - name: Get OAuth Token
        id: get_token
        run: |
          TOKEN=$(curl -X POST http://localhost:5000/oauth2/token
          -H "Authorization: Basic ${{ secrets.OAUTH_KEY }} ${{ secrets.OAUTH_SECRET }}" \
          -H "Content-Type: application/x-www-form-urlencoded"
          -d "grant_type=client_credentials" | jq -r '.access_token')
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
        
      - name: Call my API endpoint closed
        run: echo "running scheduler ${{ env.TOKEN }}"
