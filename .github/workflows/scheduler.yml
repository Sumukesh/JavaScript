name: Scheduled Job

on:
  schedule:
   - cron: '*/3 * * * *'

permissions:
  contents: read

jobs:
  run-scheduled-task:
    runs-on: ubuntu-latest
    steps:
      - name: Get OAuth Token
        id: get_token
        run: |
          TOKEN=$(curl -X POST http://localhost:5000/oauth2/token
          -H "Authorization: Basic ${{ secrets.OAUTH_KEY }} ${{ secrets.OAUTH_SECRET }}" \
          -H "Content-Type: application/x-www-form-urlencoded"
          -d "grant_type=client_credentials" | jq -r '.access_token')
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Calling API endpoint wave1
        run: |
          curl -X GET http://localhost:5000/virtualsupply/endeavor/wave1-sync \
            -H "Authorization: Bearer ${ { env.TOKEN } }" \
            -d "retrieverFiles=true"

      - name: Calling API endpoint wave2
        run: |
          curl -X GET http://localhost:5000/virtualsupply/endeavor/wave2-sync \
            -H "Authorization: Bearer ${ { env.TOKEN } }" \
            -d "retrieverFiles=true"
